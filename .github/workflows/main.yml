name: Flutter Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ⚠️ استبدل YOUR_ACTUAL_FOLDER_NAME باسم المجلد الفرعي الحقيقي
      - name: Install dependencies
        working-directory: ./YOUR_ACTUAL_FOLDER_NAME
        run: flutter pub get

      - name: Build APK
        working-directory: ./YOUR_ACTUAL_FOLDER_NAME
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: YOUR_ACTUAL_FOLDER_NAME/build/app/outputs/flutter-apk/app-release.apk
